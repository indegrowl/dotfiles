# Catppuccin Mocha, Peach accent. See https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font   = CaskaydiaCove Nerd Font
$base   = rgb(1e1e2e)
$text   = rgb(cdd6f4)
$sub    = rgb(a6adc8)
$peach  = rgb(fab387)
$green  = rgb(a6e3a1)
$red    = rgb(f38ba8)

general {
    hide_cursor = true
}

background {
    monitor =
    color = $base
    path = screenshot
    blur_passes = 3
    brightness = 0.5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    rounding = 0
    inner_color = $base
    outer_color = $peach
    check_color = $green
    fail_color = $red
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $sub
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}
